name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Dependencies and Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 patchelf build-essential libssl-dev libffi-dev python3-pip
        pip install --upgrade pip
        pip install --user cython==0.29.37
        pip install --user --upgrade buildozer

    - name: Dual Trap and Mirror Intersection for SDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # Строим двойную ловушку: и системный путь, и локальный дом runner'а
        mkdir -p ~/.buildozer/android/platform/
        rm -rf ~/.buildozer/android/platform/android-sdk
        cp -r $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        
        # Ставим все инструменты во все потенциальные точки спроса
        echo "y" | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" "platform-tools"
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.2" "platforms;android-33" "platform-tools"

        # Создаем зеркала и перекрестные обманки (если попытается найти одно — наткнется на другое)
        cd ~/.buildozer/android/platform/android-sdk/build-tools/
        for target_dir in 33.0.0 37.0.0 34.0.0 current; do
          if [ ! -e "$target_dir" ]; then
            if [ -d "33.0.2" ]; then
              ln -sfn 33.0.2 "$target_dir"
            else
              # Универсальная заглушка на любой доступный вариант внутри
              first_available=$(ls -d */ | head -n 1 | tr -d '/')
              if [ -n "$first_available" ]; then
                ln -sfn "$first_available" "$target_dir"
              fi
            fi
          fi
        done

    - name: Build APK with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
