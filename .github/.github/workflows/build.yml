name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Dependencies and Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 patchelf build-essential libssl-dev libffi-dev python3-pip
        pip install --upgrade pip
        pip install --user cython==0.29.37
        pip install --user --upgrade buildozer

    - name: Feed Buildozer Direct SDK and All Future Mirrors
      run: |
        export PATH=$PATH:~/.local/bin
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

        # Кормим системный SDK всем необходимым
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0" "platforms;android-34" "platform-tools"

        # Создаем домашний контур для Buildozer прямо перед стартом и набиваем его едой до отказа
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/
        rm -rf ~/.buildozer/android/platform/android-sdk/*
        cp -r /usr/local/lib/android/sdk/* ~/.buildozer/android/platform/android-sdk/

        # Раскладываем зеркала-обманки на любые воображаемые версии 37, 38, 39 и т.д.
        cd ~/.buildozer/android/platform/android-sdk/build-tools/
        if [ -d "34.0.0" ]; then
          for v in 37.0.0 37.0.1 38.0.0 39.0.0; do
            rm -rf "$v"
            cp -r 34.0.0 "$v"
          done
        fi

        # Запускаем сборку в том же потоке, чтобы он съел подготовленное
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
