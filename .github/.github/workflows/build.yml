    - name: Ultimate Override Trap for 37.0.0
      run: |
        export PATH=$PATH:~/.local/bin
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # 1. Готовим правильную версию
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.2" "platforms;android-33" "platform-tools"
        
        # 2. Создаем структуру и копируем рабочие файлы в 37.0.0
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        cp -r $ANDROID_HOME/build-tools/33.0.2/* ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        
        # 3. Делаем перехватчик прямо в текущей папке
        mkdir -p ~/bin
        echo '#!/bin/bash' > ~/bin/sdkmanager
        echo 'echo "Intercepted: Using 33.0.2 instead of 37.0.0"' >> ~/bin/sdkmanager
        echo 'exit 0' >> ~/bin/sdkmanager
        chmod +x ~/bin/sdkmanager
        export PATH=~/bin:$PATH

        # 4. Защищаем от удаления
        chmod -R 555 ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0

        # 5. Сборка
        buildozer -v android debug
