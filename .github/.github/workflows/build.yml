name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Dependencies and Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 patchelf build-essential libssl-dev libffi-dev python3-pip
        pip install --upgrade pip
        pip install --user cython==0.29.37
        pip install --user --upgrade buildozer

    - name: Physical Deletion of Illiquid Paths and Here-and-Now Injection
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # Гарантированно ставим актуальные инструменты в системный SDK
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.2" "platforms;android-33" "platform-tools"
        
        # Полностью сносим старые неликвидные пути и создаем структуру заново здесь и сейчас
        rm -rf ~/.buildozer/android/platform/android-sdk
        mkdir -p ~/.buildozer/android/platform/
        cp -r $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        
        # Физически дублируем рабочие билды на место любых запрашиваемых версий без пустых ссылок
        cd ~/.buildozer/android/platform/android-sdk/build-tools/
        if [ -d "33.0.2" ]; then
          rm -rf 37.0.0 33.0.0
          cp -r 33.0.2 37.0.0
          cp -r 33.0.2 33.0.0
        fi

    - name: Build APK with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
