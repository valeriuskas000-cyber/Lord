name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Clear Buildozer Cache
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer

    - name: Install Dependencies and Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 patchelf build-essential libssl-dev libffi-dev python3-pip
        pip install --upgrade pip
        pip install --user cython==0.29.37
        pip install --user --upgrade buildozer

    - name: Build APK with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25b
        export ANDROID_HOME=/usr/local/lib/android/sdk

        # Запускаем сборку в фоне или даем ей один раз упасть, 
        # ЛИБО заранее создаем структуру папок, которую он проверяет, 
        # скопировав туда реальный aidl из системного Android SDK GitHub
        
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        
        # Копируем всё из системного build-tools (там точно есть aidl) в ту папку, которую он требует
        if [ -d "$ANDROID_HOME/build-tools/33.0.2" ]; then
          cp -r $ANDROID_HOME/build-tools/33.0.2/* ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        elif [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
          cp -r $ANDROID_HOME/build-tools/34.0.0/* ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        fi

        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
