name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Dependencies and Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 patchelf build-essential libssl-dev libffi-dev python3-pip
        pip install --upgrade pip
        pip install --user cython==0.29.37
        pip install --user --upgrade buildozer

    - name: Put SDK in Home Runner and Link Connections
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # Создаем директорию в home runner, куда Buildozer гарантированно смотрит
        mkdir -p ~/.buildozer/android/platform/
        
        # Переносим и связываем всю структуру SDK прямо в домашнюю зону runner'а
        rm -rf ~/.buildozer/android/platform/android-sdk
        cp -r $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        
        # Защищаем права и гарантируем наличие aidl в нужной версии
        chmod -R +x ~/.buildozer/android/platform/android-sdk/
        
        # Устанавливаем недостающие инструменты на здесь и сейчас в домашних связях
        echo "y" | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" "platform-tools"

    - name: Build APK with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
